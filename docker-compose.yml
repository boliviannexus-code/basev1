services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-nexgol-app:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: pgsql
      DB_PORT: 5432
      LEGACY_DB_HOST: legacy_mysql
      LEGACY_DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BIOMETRIC_ENGINE_URL: http://biometric-engine:8001
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    ports:
      - "8082:80"
    volumes:
      - nexgol-storage:/var/www/html/storage
    depends_on:
      pgsql:
        condition: service_healthy
      legacy_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      biometric-engine:
        condition: service_started
    networks:
      - nexgol

  queue:
    image: ${DOCKER_IMAGE:-nexgol-app:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: pgsql
      DB_PORT: 5432
      LEGACY_DB_HOST: legacy_mysql
      LEGACY_DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BIOMETRIC_ENGINE_URL: http://biometric-engine:8001
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    volumes:
      - nexgol-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - nexgol

  scheduler:
    image: ${DOCKER_IMAGE:-nexgol-app:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: pgsql
      DB_PORT: 5432
      LEGACY_DB_HOST: legacy_mysql
      LEGACY_DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BIOMETRIC_ENGINE_URL: http://biometric-engine:8001
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - nexgol-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - nexgol

  pgsql:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nexgol}
      POSTGRES_USER: ${DB_USERNAME:-sail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - nexgol-pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sail} -d ${DB_DATABASE:-nexgol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexgol

  legacy_mysql:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LEGACY_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${LEGACY_DB_DATABASE:-nexucjns_mejillones}
      MYSQL_USER: ${LEGACY_DB_USERNAME:-legacy}
      MYSQL_PASSWORD: ${LEGACY_DB_PASSWORD:-legacy}
    volumes:
      - nexgol-legacy-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexgol

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - nexgol-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexgol

  biometric-engine:
    build:
      context: ./biometric-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - nexgol

networks:
  nexgol:
    driver: bridge

volumes:
  nexgol-storage:
  nexgol-pgsql:
  nexgol-legacy-mysql:
  nexgol-redis:
