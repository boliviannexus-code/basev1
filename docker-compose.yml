services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-nexgol-app:latest}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: pgsql
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - nexgol-storage:/var/www/html/storage
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexgol

  queue:
    image: ${DOCKER_IMAGE:-nexgol-app:latest}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: pgsql
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    volumes:
      - nexgol-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - nexgol

  scheduler:
    image: ${DOCKER_IMAGE:-nexgol-app:latest}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: pgsql
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - nexgol-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - nexgol

  pgsql:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexgol_db
      POSTGRES_USER: nexgol_user
      POSTGRES_PASSWORD: DaniloMoreno4
    volumes:
      - nexgol-pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexgol_user -d nexgol_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexgol

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - nexgol-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexgol

networks:
  nexgol:
    driver: bridge

volumes:
  nexgol-storage:
  nexgol-pgsql:
  nexgol-redis:
